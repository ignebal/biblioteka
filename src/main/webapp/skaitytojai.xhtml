<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Skaitytojai</title>
</h:head>
<h:body>
    <h1>Skaitytojai</h1>

    <h:dataTable value="#{skaitytojasController.visiSkaitytojai}" var="skaitytojas" border="1">
        <h:column>
            <f:facet name="header">ID</f:facet>
            #{skaitytojas.id}
        </h:column>
        <h:column>
            <f:facet name="header">Vardas</f:facet>
            #{skaitytojas.vardas}
        </h:column>
        <h:column>
            <f:facet name="header">Pavardė</f:facet>
            #{skaitytojas.pavarde}
        </h:column>
        <h:column>
            <f:facet name="header">Knygos</f:facet>
            <ui:repeat value="#{skaitytojas.knygos}" var="knyga">
                #{knyga.pavadinimas}&nbsp;
            </ui:repeat>
        </h:column>
    </h:dataTable>

    <h2>Pridėti skaitytoją</h2>
    <h:form>
        <h:outputLabel value="Vardas: "/>
        <h:inputText value="#{skaitytojasController.naujas.vardas}" required="true"/>
        <br/>
        <h:outputLabel value="Pavardė: "/>
        <h:inputText value="#{skaitytojasController.naujas.pavarde}" required="true"/>
        <br/>
        <h:outputLabel value="Knygos: "/>
        <h:selectManyCheckbox value="#{skaitytojasController.pasirinktoKnygosId}">
            <f:selectItems value="#{skaitytojasController.visosKnygos}"
                           var="knyga"
                           itemValue="#{knyga.id}"
                           itemLabel="#{knyga.pavadinimas}"/>
        </h:selectManyCheckbox>
        <br/>
        <h:commandButton value="Pridėti" action="#{skaitytojasController.prideti}"/>
    </h:form>

    <h:link value="Grįžti" outcome="index"/>
</h:body>
</html>
